name: Build Android

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'App to build (passenger / driver / both)'
        type: choice
        options: [both, passenger, driver]
        default: both
      submit:
        description: 'Submit to Google Play (production track) after build?'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: passenger
            working-directory: apps/mobile-passenger
            profile: production
            service-account-key-filename: woyo-google-service-account.json
          - variant: driver
            working-directory: apps/mobile-driver
            profile: production
            service-account-key-filename: woyo-driver-google-service-account.json

    steps:
      - name: Skip check
        id: skip
        run: |
          INPUT="${{ github.event.inputs.variant }}"
          VARIANT="${{ matrix.variant }}"
          if [[ "$INPUT" != "both" && "$INPUT" != "$VARIANT" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.skip.outputs.result != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.skip.outputs.result != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json

      - name: Set up JDK 17
        if: steps.skip.outputs.result != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install EAS CLI
        if: steps.skip.outputs.result != 'true'
        run: npm install -g eas-cli

      - name: Install dependencies
        if: steps.skip.outputs.result != 'true'
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Build ${{ matrix.variant }} Android app (local build, bypasses EAS cloud quota)
        if: steps.skip.outputs.result != 'true'
        working-directory: ${{ matrix.working-directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          WOYO_APP_TOKEN: ${{ secrets.WOYO_APP_TOKEN }}
          WOYO_DRIVER_APP_TOKEN: ${{ secrets.WOYO_DRIVER_APP_TOKEN }}
        run: |
          eas build \
            --local \
            --platform android \
            --profile ${{ matrix.profile }} \
            --non-interactive \
            --output ./build.aab

      - name: Write Google Play service account key
        if: steps.skip.outputs.result != 'true' && github.event.inputs.submit == 'true'
        working-directory: ${{ matrix.working-directory }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.WOYO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_ACCOUNT_JSON" > ${{ matrix.service-account-key-filename }}

      - name: Submit to Google Play (production track)
        if: steps.skip.outputs.result != 'true' && github.event.inputs.submit == 'true'
        working-directory: ${{ matrix.working-directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform android \
            --profile ${{ matrix.profile }} \
            --path ./build.aab \
            --non-interactive

      - name: Remove service account key
        if: always() && steps.skip.outputs.result != 'true' && github.event.inputs.submit == 'true'
        working-directory: ${{ matrix.working-directory }}
        run: rm -f ${{ matrix.service-account-key-filename }}
