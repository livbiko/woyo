apiVersion: apps/v1
kind: Deployment
metadata:
  name: woyo-api
  namespace: woyo
  labels:
    app: woyo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: woyo-api
  template:
    metadata:
      labels:
        app: woyo-api
    spec:
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: api
          image: lhr.ocir.io/lr14abpkfrxj/woyo-api:latest
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: woyo-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: woyo-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: woyo-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: woyo-api
  namespace: woyo
spec:
  type: ClusterIP
  selector:
    app: woyo-api
  ports:
    - port: 4001
      targetPort: 4001
