apiVersion: apps/v1
kind: Deployment
metadata:
  name: woyo-web
  namespace: woyo
  labels:
    app: woyo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: woyo-web
  template:
    metadata:
      labels:
        app: woyo-web
    spec:
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: web
          image: lhr.ocir.io/lr14abpkfrxj/woyo-web:latest
          ports:
            - containerPort: 3000
          env:
            # Next.js standalone output binds to $HOSTNAME if set, and k8s
            # auto-sets HOSTNAME to the pod name -- without this it only
            # accepts connections addressed to that pod name, not loopback.
            - name: HOSTNAME
              value: "0.0.0.0"
            # Driver registration form -> Brevo transactional email. Reuses
            # the same BREVO_API_KEY already proven working for Tekeche's
            # OTP SMS delivery (Brevo API keys are account-wide across
            # email/SMS), copied into this project's own secret rather than
            # cross-referencing Tekeche's -- see 12-notification-secret.yaml.
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: woyo-notification-secrets
                  key: BREVO_API_KEY
            - name: DRIVER_NOTIFICATION_EMAIL
              valueFrom:
                secretKeyRef:
                  name: woyo-notification-secrets
                  key: DRIVER_NOTIFICATION_EMAIL
            - name: NOTIFICATION_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: woyo-notification-secrets
                  key: NOTIFICATION_FROM_EMAIL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: woyo-web
  namespace: woyo
spec:
  type: ClusterIP
  selector:
    app: woyo-web
  ports:
    - port: 3000
      targetPort: 3000
