# Reuses the cluster's existing shared ingress-nginx controller (also
# serving tekeche.com/api.tekeche.com/livbiko.com/nouvellesdupays.com) --
# same controller, new Ingress resource/hostname. DNS for 225woyo.com
# points at the dedicated woyo-nlb (132.145.48.100), not a shared NLB --
# see ops/MAINTENANCE_LOG.md for why (user-directed: every project gets
# its own NLB, not just whichever is technically safe to share).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: woyo
  namespace: woyo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 225woyo.com
        - www.225woyo.com
      secretName: woyo-tls
  rules:
    - host: 225woyo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: woyo-web
                port:
                  number: 3000
    - host: www.225woyo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: woyo-web
                port:
                  number: 3000
