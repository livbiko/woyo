# One-shot migrate + seed job using the api image (bundles prisma/).
# Re-run manually after any schema change: `kubectl delete job woyo-migrate -n woyo`
# then `kubectl apply -f 04-migrate-job.yaml` again -- Jobs don't re-run on
# their own when the underlying image changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: woyo-migrate
  namespace: woyo
spec:
  backoffLimit: 2
  template:
    spec:
      imagePullSecrets:
        - name: ocir-pull-secret
      restartPolicy: Never
      containers:
        - name: migrate
          image: lhr.ocir.io/lr14abpkfrxj/woyo-api:latest
          command: ["sh", "-c", "npx prisma migrate deploy && node prisma-dist/seed.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: woyo-secrets
                  key: DATABASE_URL
